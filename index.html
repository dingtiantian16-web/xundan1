<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无界AR膜询单助手</title><meta name="description" content="本地分析京东聊天记录，生成询单、流失分析和群分享复盘"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b132b'/%3E%3Cpath d='M16 40c10-24 22-24 32 0' fill='none' stroke='%233de1c2' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='25' r='5' fill='%23fff'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><span class="mark">AR</span><div><h1>无界AR膜询单助手</h1><p>聊天记录在浏览器内完成分析，不上传业务数据</p></div></div><span class="pill">咨询未下单口径</span></header>
<main><section class="panel input-panel"><div class="step">01 · 导入</div><h2>把记录放进来</h2><label class="drop" id="drop"><input id="file" type="file" accept=".log,.txt"><strong>选择聊天记录</strong><span id="fileName">支持 .log / .txt，也可拖入</span></label><label>完整客户ID（每行一个，可选）<textarea id="ids" placeholder="jd_xxxxx&#10;昵称或手机号_p"></textarea></label><div class="options"><label><input type="checkbox" id="loss" checked> 生成独立流失分析</label><label><input type="checkbox" id="group" checked> 生成群分享文案</label></div><button id="run">开始分析 <span>→</span></button><p class="hint">默认将全部记录视为咨询未下单；日志订单提醒只标记为口径冲突。</p></section>
<section class="workspace"><div class="empty" id="empty"><div class="orb"></div><h2>等待分析</h2><p>上传聊天记录后，这里会出现询单、高频问题和优化建议。</p></div><div id="results" hidden><div class="stats"><div><b id="sSessions">0</b><span>会话</span></div><div><b id="sPre">0</b><span>售前</span></div><div><b id="sAfter">0</b><span>售后</span></div><div><b id="sConflict">0</b><span>订单信号冲突</span></div></div><nav class="tabs"><button class="active" data-tab="detail">询单明细</button><button data-tab="lossTab">流失分析</button><button data-tab="freq">高频问题</button><button data-tab="share">群分享</button></nav><div id="detail" class="tab active"><div class="toolbar"><span>原六列格式</span><button id="download">下载Excel兼容文件</button></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>客户ID</th><th>售前/售后</th><th>是否下单</th><th>客户问题</th><th>问题汇总</th></tr></thead><tbody id="detailBody"></tbody></table></div></div><div id="lossTab" class="tab"><div class="table-wrap"><table><thead><tr><th>客户ID</th><th>会话定位</th><th>购买阻碍/风险</th><th>判断依据</th><th>可优化项</th><th>优化建议</th></tr></thead><tbody id="lossBody"></tbody></table></div></div><div id="freq" class="tab"><div id="freqList" class="freq-list"></div><p class="note">同一通可包含多个主题；次数按会话统计，不等于独立客户数。</p></div><div id="share" class="tab"><div class="toolbar"><span>可直接发群</span><button id="copy">复制文案</button></div><textarea id="shareText" class="share"></textarea></div></div></section></main><footer>无界AR膜 · 询单分析工作台</footer><script src="app.js"></script></body></html>
